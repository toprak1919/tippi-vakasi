/* ---------- drawing ---------- */

    R('#7ec8ff', 122, 56 - b, 5, 6); R('#7ec8ff', 122, 54 - b, 4, 3); R('#ff9a3c', 127, 56 - b, 1, 1); R(INK, 124, 55 - b, 1, 1); },
  candles(t) { c.strokeStyle = '#f7c4d870'; c.beginPath(); c.ellipse(113, 113, 12, 6, 0, 0, 7); c.stroke();
    [[101,112],[107,107],[119,107],[125,112],[113,118]].forEach(([x, y]) => { R('#fff', x, y, 2, 4); R('#5d5766', x, y - 1, 1, 1); });
    R('#4a1b3a', 113, 112, 2, 2); R(FUR, 116, 114, 2, 1); },
  bed(t) { R('#1b1430', 4, 96, 30, 44); R(FUR, 6, 98, 26, 10); R('#fff', 8, 100, 9, 6); R('#fff', 21, 100, 9, 6);
    R(P, 6, 108, 26, 30); R('#e79ab8', 6, 108, 26, 2);
    R('#8c1230', 9, 99, 8, 6); R('#f3eec2', 10, 100, 3, 4); R('#f3eec2', 13, 100, 3, 4); R('#8c1230', 13, 100, 1, 4); },
  molly(t) { const bl = (t / 2300 | 0) % 5 === 0;
    R(INK, 136, 115, 10, 8); R(INK, 136, 113, 2, 2); R(INK, 144, 113, 2, 2);
    if (!bl) { R('#b6ff6a', 138, 118, 2, 2); R('#b6ff6a', 142, 118, 2, 2); R(INK, 139, 118, 1, 2); R(INK, 143, 118, 1, 2); }
    R('#b88655', 132, 122, 18, 14); R('#8f6238', 132, 122, 18, 2); R('#e9d7b0', 140, 124, 2, 12); },
};
function frame(t) {
  room(t);
  const ents = OBJ.filter(o => DRAW[o.id]).map(o => ({b: o.base, f: () => DRAW[o.id](t)}));
  ents.push({b: pl.y + 16, f: () => girl(pl.x, pl.y, pl.dir, moving ? (t / 140 | 0) % 2 : 0)});
  ents.sort((a, b) => a.b - b.b).forEach(e => e.f());
  if ((t / 350 | 0) % 2) OBJ.forEach(o => { const on = ready ? o.id === 'plate' : !seen.has(o.id);
    if (on) R(ready ? '#fff' : P, o.r[0] + o.r[2] / 2 - 1, Math.max(1, (o.s ? o.s[1] : o.r[1] + 4) - 7), 2, 2); });
}

/* ---------- input ---------- */
let dir = null, moving = false, mode = 'intro';
const KEY = {ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r', w:'u', s:'d', a:'l', d:'r'};
addEventListener('keydown', e => { if (KEY[e.key]) { dir = KEY[e.key]; e.preventDefault(); }
  else if (['z', 'Enter', ' '].includes(e.key) && !e.repeat) { act(); e.preventDefault(); } });
addEventListener('keyup', e => { if (KEY[e.key] === dir) dir = null; });
const dp = $('#dpad');
function padDir(e) { const r = dp.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
  dir = Math.abs(x) > Math.abs(y) ? (x < 0 ? 'l' : 'r') : (y < 0 ? 'u' : 'd');
  dp.querySelectorAll('i').forEach(i => i.classList.toggle('on', i.className.includes(dir))); }
const padOff = () => { dir = null; dp.querySelectorAll('i').forEach(i => i.classList.remove('on')); };
dp.addEventListener('pointerdown', e => { try { dp.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); padDir(e); });
dp.addEventListener('pointermove', e => { if (dir) padDir(e); });
dp.addEventListener('pointerup', padOff); dp.addEventListener('pointercancel', padOff);
$('#a').addEventListener('pointerdown', e => { e.preventDefault(); act(); });
$('#box').addEventListener('pointerdown', e => { if (mode === 'dialog') act(); });

/* ---------- dialogue ---------- */
let queue = [], after = null, typing = null, full = '';
function say(lines, cb) { queue = lines.slice(); after = cb || null; mode = 'dialog'; padOff(); next(); }
function next() {
  const l = queue.shift();
  if (l === undefined) { $('#meta').textContent = ''; $('#txt').textContent = ''; $('#more').style.visibility = 'hidden';
    mode = 'play'; const cb = after; after = null; if (cb) cb(); return; }
  const who = Array.isArray(l) ? l[0] : '', text = Array.isArray(l) ? l[1] : l;
  $('#meta').textContent = who; const el = $('#txt'); el.textContent = ''; $('#more').style.visibility = 'hidden';
  const chars = Array.from(text); full = text; let i = 0; const f = VOICE[who] || 440;
  typing = setInterval(() => { el.textContent += chars[i]; if (i % 2 === 0 && chars[i] !== ' ') blip(f); i++;
    if (i >= chars.length) done(); }, 24);
}
function done() { clearInterval(typing); typing = null; $('#txt').textContent = full; $('#more').style.visibility = 'visible'; }
const TOTAL = OBJ.length;
const hud = () => { $('#clues').textContent = seen.size + '/' + TOTAL; };
function got(id) { return () => { if (seen.has(id)) return; seen.add(id); hud(); blip(880, .12);
  if (seen.size === TOTAL) { ready = true; say([D.full]); } }; }
function act() {
  if (mode === 'dialog') { typing ? done() : next(); return; }
  if (mode !== 'play') return;
  const o = target(pl.x, pl.y, pl.dir); if (!o) return;
  const id = o.id;
  if (id === 'plate' && ready) return say(D.ready, () => ask(0));
  if (id === 'plate' && seen.has('plate')) return say([D.notyet.replace('{n}', seen.size).replace('{t}', TOTAL)]);
  if (id === 'tippi') return say(D.tippi[tippiTurn++ % D.tippi.length], got('tippi'));
  if (id === 'mirror') return seen.has('candles') ? say(D.mirror2, got('mirror')) : say(D.mirror1);
  say(D.obj[id], got(id));
}
function ask(n) {
  const st = D.steps[n]; mode = 'choice'; $('#meta').textContent = ''; $('#txt').textContent = st.q;
  const ch = $('#choice'); ch.style.display = 'grid'; ch.innerHTML = '';
  st.opts.forEach(op => { const b = document.createElement('button'); b.textContent = op.l;
    b.onclick = () => { ch.style.display = 'none';
      if (!op.ok) return say(op.x, () => ask(n));
      blip(660, .2);
      say(op.x, () => { if (n + 1 < D.steps.length) ask(n + 1); else { mode = 'end'; $('#end').classList.add('on'); } }); };
    ch.append(b); });
}

/* ---------- loop ---------- */
function loop(t) {
  const dt = Math.min(50, t - t0); t0 = t; moving = false;
  if (mode === 'play' && dir) { pl.dir = dir; const sp = dt * .062, v = {u:[0,-sp], d:[0,sp], l:[-sp,0], r:[sp,0]}[dir];
    if (free(pl.x + v[0], pl.y + v[1])) { pl.x += v[0]; pl.y += v[1]; moving = true; } }
  frame(t); requestAnimationFrame(loop);
}
hud(); requestAnimationFrame(loop);
$('#go').onclick = () => { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  $('#intro').classList.remove('on'); say(D.enter); };
</script>
